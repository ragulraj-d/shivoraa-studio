# Shivoraa Studio — GitLab CI
#
# Mirrors .github/workflows/pipeline.yml stage for stage, so moving between
# forges does not change what gates a release:
#
#   lint → test → build → security → deploy → verify
#
# Merge requests run everything except deploy. Pushes to main run the lot.
#
# GitLab ships Secret Detection and SAST as templates, so those replace the
# gitleaks action rather than being reimplemented — same job, maintained
# upstream, and the findings land in the MR security widget.

stages: [lint, test, build, security, deploy, verify]

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  npm_config_cache: "$CI_PROJECT_DIR/.cache/npm"
  # Secret Detection scans history, so it needs the whole thing. A shallow
  # clone would inspect one commit and report clean.
  GIT_DEPTH: 0

# Secret Detection and SAST are available on the Free tier. Dependency
# Scanning is Ultimate-only, so it is deliberately not included — the
# pip-audit and npm audit jobs below cover the same ground on any plan.
include:
  - template: Jobs/Secret-Detection.gitlab-ci.yml
  - template: Jobs/SAST.gitlab-ci.yml

cache:
  key: $CI_COMMIT_REF_SLUG
  paths: [.cache/pip, .cache/npm]

# --------------------------------------------------------------------------- #
# 1 · Lint
# --------------------------------------------------------------------------- #
lint:api:
  stage: lint
  image: python:3.12-slim
  before_script:
    - cd apps/api && pip install -e ".[dev]"
  script:
    - ruff check app tests
    - ruff format --check app tests

# --------------------------------------------------------------------------- #
# 2 · Test
# --------------------------------------------------------------------------- #
test:api:
  stage: test
  image: python:3.12-slim
  services:
    - name: postgres:17-alpine
      alias: postgres
  variables:
    POSTGRES_USER: shivoraa
    POSTGRES_PASSWORD: shivoraa
    POSTGRES_DB: shivoraa_test
    SHIVORAA_ENVIRONMENT: local
  before_script:
    - cd apps/api && pip install -e ".[dev]" asyncpg
  script:
    - pytest -q -m "not network" --tb=short
    # SQLite passing does not prove the production dialect works, so the real
    # migration path runs against Postgres every time.
    - export SHIVORAA_DATABASE_URL="postgresql+asyncpg://shivoraa:shivoraa@postgres:5432/shivoraa_test"
    - alembic upgrade head
    - alembic downgrade base

# --------------------------------------------------------------------------- #
# 3 · Build
# --------------------------------------------------------------------------- #
build:web:
  stage: build
  image: node:20-alpine
  script:
    - cd apps/web
    - npm ci || npm install
    - npx tsc --noEmit
    - npm run build
    # A size regression is invisible in review and very visible to users on a
    # slow connection, so it fails the build rather than being found later.
    - |
      BUDGET=350
      KB=$(( $(find dist/assets -name '*.js' -exec gzip -c {} \; | wc -c) / 1024 ))
      echo "JS bundle: ${KB} KB gzipped (budget ${BUDGET} KB)"
      [ "$KB" -le "$BUDGET" ] || { echo "Bundle over budget"; exit 1; }
  artifacts:
    paths: [apps/web/dist]
    expire_in: 1 day

build:extension:
  stage: build
  image: node:20-alpine
  script:
    - cd apps/extension
    - npm ci || npm install
    - npx tsc --noEmit
    - npm run build

# --------------------------------------------------------------------------- #
# 4 · Security
# --------------------------------------------------------------------------- #
# Secret Detection and SAST come from the included templates. These two cover
# dependency advisories, which Dependency Scanning would handle on Ultimate.

security:python-deps:
  stage: security
  image: python:3.12-slim
  script:
    - cd apps/api
    - pip install pip-audit
    - pip install -e .
    - pip-audit --skip-editable

security:npm-deps:
  stage: security
  image: node:20-alpine
  script:
    - cd apps/web
    # High and critical fail. Moderate is reported but does not block:
    # transitive dev-only advisories would otherwise wedge the pipeline on
    # something that never reaches a user.
    - npm audit --audit-level=moderate || true
    - npm audit --audit-level=high

# Run the scanners on merge requests too, not only on main — a secret is far
# cheaper to catch before it is merged.
secret_detection:
  stage: security
  rules:
    - if: $CI_MERGE_REQUEST_IID
    - if: $CI_COMMIT_BRANCH == "main"

sast:
  stage: security
  rules:
    - if: $CI_MERGE_REQUEST_IID
    - if: $CI_COMMIT_BRANCH == "main"

# --------------------------------------------------------------------------- #
# 5 · Deploy — main only
# --------------------------------------------------------------------------- #
deploy:firebase:
  stage: deploy
  image: node:20-alpine
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  environment:
    name: production
    url: https://studio.shivoraa.in
  dependencies: [build:web]
  script:
    - npm install -g firebase-tools
    # FIREBASE_SERVICE_ACCOUNT is a masked, protected CI/CD variable holding the
    # service account JSON. Written to a file because the CLI reads a path.
    - echo "$FIREBASE_SERVICE_ACCOUNT" > /tmp/sa.json
    - export GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json
    # Scoped to the studio target. The primary site serves shivoraa.in and must
    # never be published to from this repo.
    - firebase deploy --only hosting:studio --project shivoraa --non-interactive
    # Best-effort until the service account has roles/firebaserules.admin —
    # see DEPLOY.md. It warns rather than failing, and never silently succeeds.
    - |
      firebase deploy --only firestore:rules,firestore:indexes \
        --project shivoraa --non-interactive \
        || echo "WARNING: Firestore rules were NOT deployed — grant roles/firebaserules.admin"
    - rm -f /tmp/sa.json

# --------------------------------------------------------------------------- #
# 6 · Verify
# --------------------------------------------------------------------------- #
verify:live:
  stage: verify
  image: alpine:3
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  before_script:
    - apk add --no-cache curl
  script:
    - |
      for i in $(seq 1 12); do
        code=$(curl -s -o /dev/null -w '%{http_code}' https://studio.shivoraa.in || true)
        [ "$code" = "200" ] && echo "studio.shivoraa.in -> 200" && break
        sleep 5
      done
      [ "$code" = "200" ] || { echo "Site did not return 200 after deploy"; exit 1; }
    - |
      fail=0
      for path in /icon-32.png /manifest.webmanifest /api/status.json /settings; do
        code=$(curl -s -o /dev/null -w '%{http_code}' "https://studio.shivoraa.in${path}")
        echo "  ${path} -> ${code}"
        [ "$code" = "200" ] || fail=1
      done
      [ "$fail" = "0" ] || { echo "A published path did not return 200"; exit 1; }
    # Every seeded request targets this endpoint. If the CORS header regresses,
    # the first thing a new user tries breaks.
    - |
      header=$(curl -s -I -H 'Origin: https://studio.shivoraa.in' \
        https://studio.shivoraa.in/api/status.json | grep -i 'access-control-allow-origin' || true)
      echo "  ${header:-none}"
      [ -n "$header" ] || { echo "CORS header missing on the example API"; exit 1; }
    # This repo deploys a different Hosting site in the same project. Proving
    # the main site still serves its own content closes that risk each time.
    - |
      title=$(curl -s https://shivoraa.in | grep -o '<title>.*</title>' || true)
      echo "  ${title}"
      case "$title" in
        *"Shivoraa Studio"*) echo "shivoraa.in is serving Studio — wrong target"; exit 1 ;;
      esac
