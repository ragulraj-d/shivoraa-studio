name: shivoraa-studio

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shivoraa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shivoraa}
      POSTGRES_DB: ${POSTGRES_DB:-shivoraa}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-shivoraa}']
      interval: 5s
      timeout: 5s
      retries: 10

  # Runs migrations to completion, then exits. The API waits on it so it never
  # starts against a schema that hasn't been upgraded yet.
  migrate:
    build:
      context: ./apps/api
    command: ['alembic', 'upgrade', 'head']
    environment:
      SHIVORAA_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-shivoraa}:${POSTGRES_PASSWORD:-shivoraa}@db:5432/${POSTGRES_DB:-shivoraa}
      SHIVORAA_SECRET_KEY: ${SHIVORAA_SECRET_KEY:-dev-only-change-me-in-production-please-32b}
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  api:
    build:
      context: ./apps/api
    environment:
      SHIVORAA_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-shivoraa}:${POSTGRES_PASSWORD:-shivoraa}@db:5432/${POSTGRES_DB:-shivoraa}
      SHIVORAA_SECRET_KEY: ${SHIVORAA_SECRET_KEY:-dev-only-change-me-in-production-please-32b}
      SHIVORAA_ENCRYPTION_KEY: ${SHIVORAA_ENCRYPTION_KEY:-}
      SHIVORAA_ENVIRONMENT: ${SHIVORAA_ENVIRONMENT:-local}
      SHIVORAA_DEPLOYMENT_MODE: ${SHIVORAA_DEPLOYMENT_MODE:-saas}
      SHIVORAA_CORS_ORIGINS: ${SHIVORAA_CORS_ORIGINS:-http://localhost:5173,http://localhost:8080}
      SHIVORAA_COOKIE_SECURE: ${SHIVORAA_COOKIE_SECURE:-false}
      SHIVORAA_TRIAL_OPENAI_KEY: ${SHIVORAA_TRIAL_OPENAI_KEY:-}
    ports:
      - '${API_PORT:-8000}:8000'
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      args:
        VITE_API_URL: /api/v1
    ports:
      - '${WEB_PORT:-8080}:80'
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
