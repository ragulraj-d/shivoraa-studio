# Render Blueprint — deploys the Shivoraa Studio API and its database.
#
# In Render: New → Blueprint → connect ragulraj-d/shivoraa-studio.
# Everything below is applied automatically; no console clicking required.
#
# The frontend is NOT here — it stays on Firebase Hosting at
# studio.shivoraa.in. This blueprint only provides the backend the SPA calls.

databases:
  - name: shivoraa-db
    databaseName: shivoraa
    user: shivoraa
    plan: free
    region: singapore # closest free region to India
    postgresMajorVersion: '16'
    ipAllowList: [] # reachable only from inside Render's network

services:
  - type: web
    name: shivoraa-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    healthCheckPath: /health
    autoDeploy: true # every push to main redeploys
    branch: main

    envVars:
      # Render injects `postgres://...`, which SQLAlchemy 2 rejects and which
      # has no async driver. The app rewrites it to postgresql+asyncpg:// on
      # startup, so this can be wired directly.
      - key: SHIVORAA_DATABASE_URL
        fromDatabase:
          name: shivoraa-db
          property: connectionString

      # Free tier runs a single instance, so applying migrations at boot is
      # safe. With replicas this must move to a separate job.
      - key: RUN_MIGRATIONS
        value: 'true'

      # generateValue creates a strong random value once and keeps it across
      # deploys. Critically, this means the encryption key is never typed,
      # pasted, or committed anywhere.
      - key: SHIVORAA_SECRET_KEY
        generateValue: true

      # NOTE: this must be a Fernet key (44-char base64), which generateValue
      # cannot produce. Set it manually in the Render dashboard — see DEPLOY.md.
      # Losing or changing it makes every stored provider key and secret
      # variable permanently unreadable.
      - key: SHIVORAA_ENCRYPTION_KEY
        sync: false

      - key: SHIVORAA_ENVIRONMENT
        value: production
      - key: SHIVORAA_DEPLOYMENT_MODE
        value: saas
      - key: SHIVORAA_COOKIE_SECURE
        value: 'true'
      - key: SHIVORAA_COOKIE_SAMESITE
        value: lax

      # The SPA's origin. Exact match, never a wildcard.
      - key: SHIVORAA_CORS_ORIGINS
        value: https://studio.shivoraa.in,https://shivoraa-studio.web.app

      # Optional: set in the dashboard to enable the Google button.
      - key: SHIVORAA_GOOGLE_CLIENT_ID
        sync: false

      # Optional: an OpenAI key that powers the 50 free AI actions new users
      # get before connecting their own provider.
      - key: SHIVORAA_TRIAL_OPENAI_KEY
        sync: false
