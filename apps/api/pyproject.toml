[project]
name = "shivoraa-api"
version = "0.1.0"
description = "Shivoraa Studio — AI-powered API platform backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.17",
    "pyjwt>=2.10.0",
    "argon2-cffi>=23.1.0",
    "cryptography>=44.0.0",
    "httpx[http2]>=0.28.0",
    "email-validator>=2.2.0",
    "structlog>=24.4.0",
    "sse-starlette>=2.1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "aiosqlite>=0.20.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
ignore = [
    "B008",   # FastAPI Depends() in argument defaults is the documented pattern
    "UP042",  # str+Enum is deliberate: these serialise to JSON as their value
    "UP046",  # Generic[T] over PEP 695 syntax, for SQLAlchemy compatibility
    "SIM105", # try/except/pass reads more clearly than contextlib.suppress here
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["network: makes a real outbound HTTP call"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
