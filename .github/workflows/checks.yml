name: Checks

# Checks only — this workflow does not deploy.
#
#   lint → test → build → security
#
# Releases come from GitLab (.gitlab-ci.yml). Two systems publishing the same
# Firebase site would race each other, and the loser would silently overwrite
# the winner. This runs while the repository still lives on GitHub, and can be
# deleted once the migration is complete.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------ #
  # 1 · Lint
  # ------------------------------------------------------------------ #
  lint:
    name: 1 · Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install API
        working-directory: apps/api
        run: pip install -e ".[dev]"

      - name: Ruff
        working-directory: apps/api
        run: |
          ruff check app tests
          ruff format --check app tests

  # ------------------------------------------------------------------ #
  # 2 · Test
  # ------------------------------------------------------------------ #
  test:
    name: 2 · Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: shivoraa
          POSTGRES_PASSWORD: shivoraa
          POSTGRES_DB: shivoraa_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install API
        working-directory: apps/api
        run: pip install -e ".[dev]" asyncpg

      - name: Unit and integration tests
        working-directory: apps/api
        env:
          SHIVORAA_ENVIRONMENT: local
        run: pytest -q -m "not network" --tb=short

      - name: Migrations apply and roll back on PostgreSQL
        # SQLite passing does not prove the production dialect works, so the
        # real migration path runs against Postgres on every pipeline.
        working-directory: apps/api
        env:
          SHIVORAA_DATABASE_URL: postgresql+asyncpg://shivoraa:shivoraa@localhost:5432/shivoraa_test
        run: |
          alembic upgrade head
          alembic downgrade base

  # ------------------------------------------------------------------ #
  # 3 · Build
  # ------------------------------------------------------------------ #
  build:
    name: 3 · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Typecheck and build web
        working-directory: apps/web
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          npm ci || npm install
          npx tsc --noEmit
          npm run build

      - name: Enforce bundle budget
        working-directory: apps/web
        # A size regression is invisible in review and very visible to users on
        # slow connections, so it fails the build rather than being found later.
        run: |
          BUDGET=350
          KB=$(( $(find dist/assets -name '*.js' -exec gzip -c {} \; | wc -c) / 1024 ))
          echo "JS bundle: ${KB} KB gzipped (budget ${BUDGET} KB)"
          [ "$KB" -le "$BUDGET" ] || { echo "::error::Bundle over budget"; exit 1; }

      - name: Typecheck and build extension
        working-directory: apps/extension
        run: |
          npm ci || npm install
          npx tsc --noEmit
          npm run build

      - name: Keep the build for the deploy stage
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 1

  # ------------------------------------------------------------------ #
  # 4 · Security
  # ------------------------------------------------------------------ #
  security:
    name: 4 · Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans history, so it needs all of it. With the default
          # shallow clone it would inspect a single commit and report clean.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Audit Python dependencies
        working-directory: apps/api
        run: |
          pip install pip-audit
          pip install -e .
          pip-audit --skip-editable

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Audit npm dependencies
        working-directory: apps/web
        # High and critical fail the build. Moderate is reported but does not
        # block: transitive dev-only advisories would otherwise wedge the
        # pipeline on something that never reaches a user.
        run: |
          npm audit --audit-level=moderate || true
          npm audit --audit-level=high

      - name: Scan git history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
