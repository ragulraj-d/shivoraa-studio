name: Pipeline

# One pipeline, every stage:
#
#   lint → test → build → security → deploy → verify
#
# Pull requests run everything except deploy. Pushes to main run the lot.
# There is no second workflow and no way to ship without passing this one.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # Queue pushes to main so two deploys never overlap; cancel superseded PR runs.
  group: pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------ #
  # 1 · Lint
  # ------------------------------------------------------------------ #
  lint:
    name: 1 · Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install API
        working-directory: apps/api
        run: pip install -e ".[dev]"

      - name: Ruff
        working-directory: apps/api
        run: |
          ruff check app tests
          ruff format --check app tests

  # ------------------------------------------------------------------ #
  # 2 · Test
  # ------------------------------------------------------------------ #
  test:
    name: 2 · Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: shivoraa
          POSTGRES_PASSWORD: shivoraa
          POSTGRES_DB: shivoraa_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install API
        working-directory: apps/api
        run: pip install -e ".[dev]" asyncpg

      - name: Unit and integration tests
        working-directory: apps/api
        env:
          SHIVORAA_ENVIRONMENT: local
        run: pytest -q -m "not network" --tb=short

      - name: Migrations apply and roll back on PostgreSQL
        # SQLite passing does not prove the production dialect works, so the
        # real migration path runs against Postgres on every pipeline.
        working-directory: apps/api
        env:
          SHIVORAA_DATABASE_URL: postgresql+asyncpg://shivoraa:shivoraa@localhost:5432/shivoraa_test
        run: |
          alembic upgrade head
          alembic downgrade base

  # ------------------------------------------------------------------ #
  # 3 · Build
  # ------------------------------------------------------------------ #
  build:
    name: 3 · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Typecheck and build web
        working-directory: apps/web
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          npm ci || npm install
          npx tsc --noEmit
          npm run build

      - name: Enforce bundle budget
        working-directory: apps/web
        # A size regression is invisible in review and very visible to users on
        # slow connections, so it fails the build rather than being found later.
        run: |
          BUDGET=350
          KB=$(( $(find dist/assets -name '*.js' -exec gzip -c {} \; | wc -c) / 1024 ))
          echo "JS bundle: ${KB} KB gzipped (budget ${BUDGET} KB)"
          [ "$KB" -le "$BUDGET" ] || { echo "::error::Bundle over budget"; exit 1; }

      - name: Typecheck and build extension
        working-directory: apps/extension
        run: |
          npm ci || npm install
          npx tsc --noEmit
          npm run build

      - name: Keep the build for the deploy stage
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 1

  # ------------------------------------------------------------------ #
  # 4 · Security
  # ------------------------------------------------------------------ #
  security:
    name: 4 · Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Audit Python dependencies
        working-directory: apps/api
        run: |
          pip install pip-audit
          pip install -e .
          pip-audit --skip-editable || true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Audit npm dependencies
        working-directory: apps/web
        run: npm audit --audit-level=high || true

      - name: Check for committed secrets
        # A key pasted into a commit is far cheaper to catch here than after it
        # is pushed. Tests are excluded: the redaction suite contains deliberate
        # credential-shaped fixtures, and failing on those would train everyone
        # to ignore this stage.
        run: |
          if grep -rInE '(sk-[A-Za-z0-9]{32,}|gsk_[A-Za-z0-9]{40,}|ghp_[A-Za-z0-9]{36,})' \
             --include='*.ts' --include='*.tsx' --include='*.py' --include='*.json' \
             --exclude-dir=node_modules --exclude-dir=tests --exclude-dir=dist . ; then
            echo "::error::A credential-shaped string was found in the source"
            exit 1
          fi
          echo "No credential-shaped strings found outside test fixtures"

  # ------------------------------------------------------------------ #
  # 5 · Deploy — main only
  # ------------------------------------------------------------------ #
  deploy:
    name: 5 · Deploy
    runs-on: ubuntu-latest
    needs: [lint, test, build, security]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: production
      url: https://studio.shivoraa.in

    steps:
      - uses: actions/checkout@v4

      - name: Take the build that was already verified
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist

      - name: Publish to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SHIVORAA }}
          projectId: shivoraa
          # Scoped to the studio target. The primary site serves shivoraa.in and
          # must never be published to from this repo.
          target: studio
          channelId: live

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Publish Firestore rules and indexes
        # The rules are the entire authorization layer here, so they should ship
        # with the code that depends on them. The deploy service account created
        # by `firebase init hosting:github` only has Hosting permissions, so this
        # step is best-effort until it is granted roles/firebaserules.admin —
        # see DEPLOY.md. It warns loudly rather than failing the deploy, and
        # never silently succeeds.
        continue-on-error: true
        id: rules
        run: |
          npm install -g firebase-tools
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_SHIVORAA }}' > /tmp/sa.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json
          firebase deploy --only firestore:rules,firestore:indexes \
            --project shivoraa --non-interactive
          rm -f /tmp/sa.json

      - name: Warn if rules did not deploy
        if: steps.rules.outcome == 'failure'
        run: |
          echo "::warning::Firestore rules were NOT deployed — the CI service account lacks"
          echo "::warning::roles/firebaserules.admin. Deploy them manually:"
          echo "::warning::  firebase deploy --only firestore:rules --project shivoraa"

  # ------------------------------------------------------------------ #
  # 6 · Verify
  # ------------------------------------------------------------------ #
  verify:
    name: 6 · Verify
    runs-on: ubuntu-latest
    needs: deploy
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    steps:
      - name: The site is actually serving
        run: |
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://studio.shivoraa.in || true)
            [ "$code" = "200" ] && echo "studio.shivoraa.in → 200" && exit 0
            sleep 5
          done
          echo "::error::Site did not return 200 after deploy"
          exit 1

      - name: Assets and the example API resolve
        run: |
          fail=0
          for path in /icon-32.png /manifest.webmanifest /api/status.json /settings; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://studio.shivoraa.in${path}")
            echo "  ${path} → ${code}"
            [ "$code" = "200" ] || fail=1
          done
          [ "$fail" = "0" ] || { echo "::error::A published path did not return 200"; exit 1; }

      - name: The example API still allows browser calls
        # Every seeded request targets this. If the CORS header regresses, the
        # first thing a new user tries breaks.
        run: |
          header=$(curl -s -I -H 'Origin: https://studio.shivoraa.in' \
            https://studio.shivoraa.in/api/status.json | grep -i 'access-control-allow-origin' || true)
          echo "  ${header:-none}"
          [ -n "$header" ] || { echo "::error::CORS header missing on the example API"; exit 1; }

      - name: shivoraa.in is untouched
        # This repo deploys a different Hosting site in the same project. Proving
        # the main site still serves its own content closes that risk each time.
        run: |
          title=$(curl -s https://shivoraa.in | grep -o '<title>.*</title>' || true)
          echo "  ${title}"
          case "$title" in
            *"Shivoraa Studio"*) echo "::error::shivoraa.in is serving Studio — wrong target"; exit 1 ;;
          esac
