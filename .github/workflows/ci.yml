name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API — lint, typecheck, test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: shivoraa
          POSTGRES_PASSWORD: shivoraa
          POSTGRES_DB: shivoraa_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check app tests
          ruff format --check app tests

      - name: Typecheck
        run: mypy app || true  # advisory until the codebase is fully annotated

      - name: Test
        env:
          SHIVORAA_ENVIRONMENT: local
        run: pytest -q --tb=short

      - name: Verify migrations apply to Postgres
        # SQLite passing does not prove the production dialect works, so the
        # real migration path is exercised against Postgres on every run.
        env:
          SHIVORAA_DATABASE_URL: postgresql+asyncpg://shivoraa:shivoraa@localhost:5432/shivoraa_test
        run: |
          pip install asyncpg
          alembic upgrade head
          alembic downgrade base

  web:
    name: Web — typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci || npm install
      - run: npx tsc --noEmit
      - run: npm run build

      - name: Enforce bundle budget
        # A bundle-size regression is invisible in review and very visible to
        # users on slow connections, so it fails the build rather than being
        # discovered later.
        run: |
          BUDGET=350
          TOTAL=$(find dist/assets -name '*.js' -exec gzip -c {} \; | wc -c)
          KB=$((TOTAL / 1024))
          echo "JS bundle: ${KB} KB gzipped (budget ${BUDGET} KB)"
          if [ "$KB" -gt "$BUDGET" ]; then
            echo "::error::Bundle is ${KB} KB gzipped, over the ${BUDGET} KB budget."
            exit 1
          fi

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Audit Python dependencies
        working-directory: apps/api
        run: |
          pip install pip-audit
          pip install -e .
          pip-audit --skip-editable || true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Audit npm dependencies
        working-directory: apps/web
        run: npm audit --audit-level=high || true

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/api
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/web
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
