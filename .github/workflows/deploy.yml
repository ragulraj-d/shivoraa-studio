name: Deploy

# The only path to production:
#
#   commit → push to main → tests → build → Firebase Hosting → live
#
# Nobody deploys from a laptop. Every release is reproducible from a commit
# SHA, and a broken test stops the deploy rather than reaching users.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false # never interrupt a half-finished release

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install API
        working-directory: apps/api
        run: pip install -e ".[dev]"

      - name: Lint
        working-directory: apps/api
        run: |
          ruff check app tests
          ruff format --check app tests

      - name: Test
        working-directory: apps/api
        env:
          SHIVORAA_ENVIRONMENT: local
        run: pytest -q -m "not network"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Typecheck web
        working-directory: apps/web
        run: |
          npm ci || npm install
          npx tsc --noEmit

  deploy:
    name: Deploy to Firebase Hosting
    runs-on: ubuntu-latest
    needs: test # a failing test blocks the release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Build
        working-directory: apps/web
        env:
          # Vite inlines this at build time. Empty means the app runs in local
          # mode — everything in the browser, no backend required. Set this
          # repository variable once a backend exists and the next push picks
          # it up automatically.
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          npm ci || npm install
          npm run build

      - name: Check bundle budget
        working-directory: apps/web
        run: |
          BUDGET=350
          KB=$(( $(find dist/assets -name '*.js' -exec gzip -c {} \; | wc -c) / 1024 ))
          echo "JS bundle: ${KB} KB gzipped (budget ${BUDGET} KB)"
          [ "$KB" -le "$BUDGET" ] || { echo "::error::Bundle over budget"; exit 1; }

      - name: Deploy
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: shivoraa
          # Scoped to the studio target. The primary `shivoraa` site serves
          # shivoraa.in and must never be published to from this repo.
          target: studio
          channelId: live

      - name: Verify it is actually serving
        run: |
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://shivoraa-studio.web.app || true)
            if [ "$code" = "200" ]; then echo "Live and serving"; exit 0; fi
            sleep 5
          done
          echo "::error::Site did not respond with 200 after deploy"
          exit 1
